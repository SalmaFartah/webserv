server {
    listen 8080;
    root /tmp/webserv_test/www;
    index index.html;
    
    location / {
        root /tmp/webserv_test/www/html;
        allowed_method GET;
        index index.html;
        autoindex on;
    }
    
    location /cgi-bin/ {
        root /tmp/webserv_test/www/cgi-bin;
        allowed_method GET POST;
        cgi_extension .php;
        cgi_pass /usr/bin/php-cgi;
        index index.php;
    }
    
    location /uploads/ {
        root /tmp/webserv_test/www;
        upload_store /tmp/webserv_test/www/uploads;
        allowed_method GET POST DELETE;
        client_max_body_size 10M;
        autoindex on;
    }
}