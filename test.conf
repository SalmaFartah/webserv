server {
    listen 8080;
    root /tmp/webserv_test/www;
    index index.html;
    autoindex off;
    
    location / {
        root /tmp/webserv_test/www/html;
        allowed_method GET;
        index index.html;
        autoindex on;
    }
    
    # CGI PHP
    location /cgi-bin/ {
        root /tmp/webserv_test/www/cgi-bin;
        allowed_method GET POST;
        cgi_extension .php;
        cgi_pass /usr/bin/php-cgi;  # ← AJOUTER CECI
        index index.php;
    }
    
    # Upload
    location /uploads/ {
        root /tmp/webserv_test/www;
        upload_store /tmp/webserv_test/www/uploads;
        allowed_method GET POST DELETE;
        client_max_body_size 10485760;
        autoindex on;
    }
    
    # Scripts Python
    location /scripts/ {
        root /tmp/webserv_test/www/scripts;
        allowed_method GET POST;
        cgi_extension .py;
        cgi_pass /usr/bin/python3;  # ← AJOUTER CECI
    }
}