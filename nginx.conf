{
    listen 127.0.0.1:8080;
    root /var/www/site2;
    error_page 404 /path/to/file.html;
    index Makefile;
    location /somth
    {
        error_page 400 /path/to/file2.html;
        allowed_method GET POST DELETE;
    }
}

