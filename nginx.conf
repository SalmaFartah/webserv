server 
{
    listen 8080;
    index index.html;
    error_page 404 /error_pages/404.html;
    client_max_body_size 11;

    root /Users/ychedmi;
    # location /
    # {
    #     allowed_method POST;
    #     autoindex off;
    # }
    location /images
    {
        allowed_method POST DELETE;
        autoindex off;
        # return 302 http://google.com;
        # cgi_extension .pyt;
        # cgi_pass /bin/sh;
        upload_store /as/dw;
    }

    location /images/png {
        client_max_body_size 12;
        autoindex on;
        index tours1.html;
        allowed_method GET POST;
    }

    location /cgi/
    {
        # cgi_extension .py;
        # upload_store /as/dw;
        allowed_method GET POST;
        autoindex off;
    }

    location /data {
        return 301 https://tours;
    }

}

