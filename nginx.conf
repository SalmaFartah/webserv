server 
{
    listen 8080;
    root /;
    index index.html;
    error_page 404 /error_pages/404.html;
    client_max_body_size 300;

    # location /
    # {
    #     allowed_method POST;
    #     autoindex off;
    # }
    location /images
    {
        # allowed_method POST DELETE;
        autoindex off;
    }

    location /images/png {
        client_max_body_size 12;
        autoindex on;
        index tours1.html;
        allowed_method GET POST;
    }


    location /data {
        return 301 https://tours;
    }

}

