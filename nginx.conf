server 
{
    listen 8002;
    root /\;
    index index.html;
    error_page 404 /error_pages/404.html;
    client_max_body_size 3000000;

    location / {
        # allowed_method POST DELETE;
        autoindex off;
    }

    location /tours {
        autoindex on;
        index tours1.html;
        # allowed_method GET POST;
    }

    location /red {
        return 301 https://tours;
    }

    location /cgi-bin {
        root /;
        # allowed_method GET POST DELETE;
        index time.py;
        cgi_pass /usr/bin/python3;
        cgi_extension .py;
    }
}

server {
    
    # server_name site1.com;
    root /var/www/site1;
}

server {
    listen 80;
    # server_name site2.com;
    root /var/www/site2;
}

server{root /;}